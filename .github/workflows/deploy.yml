name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-northeast1
  GCP_PROJECT_ID: lms-279
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev/lms-279/lms-279

jobs:
  # CI checks must pass before deployment
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-firestore-indexes:
    name: Deploy Firestore Indexes
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Firestore indexes
        run: |
          # Install firebase-tools
          npm install -g firebase-tools

          # Deploy indexes using gcloud auth (Workload Identity Federation)
          firebase deploy --only firestore:indexes --project=${{ env.GCP_PROJECT_ID }} --non-interactive

      - name: Wait for mcp_oauth_store Firestore indexes to become READY
        run: |
          # Phase 1a PR2: `firebase deploy --only firestore:indexes` は index作成の
          # リクエストを送信して返るだけで、Firestore側の非同期ビルド完了(READY)を
          # 待たない(Codex review再指摘、P1)。deploy-mcp job を本 job に依存させる
          # だけでは index rollout race を防げず、初回デプロイ直後に
          # findByUid/findByUserCode/revokeByGrantId が FAILED_PRECONDITION に
          # なりうる。mcp_oauth_store の複合indexが全て READY になるまでポーリングし、
          # それまで deploy-mcp job（本job成功後に needs で起動）を進ませない。
          # 他collectionGroupの既存indexは通常運用中は既にREADYのため対象を絞る。
          for i in $(seq 1 30); do
            STATES=$(gcloud firestore indexes composite list \
              --project=${{ env.GCP_PROJECT_ID }} \
              --filter="COLLECTION_GROUP:mcp_oauth_store" \
              --format="value(state)")
            if [ -z "$STATES" ]; then
              echo "mcp_oauth_store indexes not visible yet, waiting... (attempt $i/30)"
            elif ! echo "$STATES" | grep -qv "^READY$"; then
              echo "all mcp_oauth_store composite indexes are READY"
              exit 0
            else
              echo "mcp_oauth_store indexes still building: $STATES (attempt $i/30)"
            fi
            sleep 20
          done
          echo "timed out waiting for mcp_oauth_store Firestore indexes to become READY" >&2
          exit 1

  deploy-api:
    name: Deploy API
    needs: [ci]
    # Note: Firestore indexes are deployed independently and don't block service deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -f services/api/Dockerfile -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/api:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest

      - name: Deploy API to Cloud Run
        run: |
          # Build env vars string
          # NODE_ENV=production は Issue #290 fail-safe (tenant-auth.ts/super-admin.ts の
          # isProductionRuntime) の二重防御として明示。K_SERVICE 自動注入が効かないデプロイ
          # 経路（ローカル再現等）でも本番判定が効くようにする。
          # SESSION_DURATION_MS=10800000 (3時間): 動画 60-80分 + テスト所要時間で
          # 2時間運用では time_limit 強制退室が頻発したため延長 (2026-05-16, 現場声対応)
          # GCS_RESOURCE_BUCKET=lms-279-resources: 講座資料 PDF (ADR-036) の保存先。
          # 動画バケットとは別に独立して IAM/lifecycle/監査を管理する。
          # 単一バケット運用 (dev project / dev Cloud Run なし)。
          # PDF object は master lesson prefix (lessons/{masterLessonId}/...) で管理し、
          # tenant 配信は Firestore メタ (pdfGcsPath) のディープコピーで分離する。
          # 2026-05-17 にバケット作成済み + default compute SA に objectAdmin (bucket scope) 付与済み。
          # DXCOLLEGE_DISPATCH_SUBJECT / DXCOLLEGE_SENDER_EMAIL: Phase 7 DXcollege 自動完了通知用
          #   (ADR-037 案 X、SendAs alias 送信)。subject = DWD JWT impersonation 対象 (実 mailbox)、
          #   sender = MIME From ヘッダ用 alias。spec §5/§8.2 で確定済みの固定値。
          # DISPATCH_OIDC_AUDIENCE: Cloud Scheduler が発行する OIDC token の audience。
          #   api Cloud Run service URL と一致させる必要があるため secret 経由 (環境ごとに異なる)。
          #   未設定なら mount スキップ (services/api/src/index.ts の isProductionGcpRuntime で
          #   fail loud → 設定漏れを起動時に検知)。
          # NOTE: gcloud `--set-env-vars` のデフォルト区切り文字はカンマ `,` だが、
          # CORS_ORIGIN は複数 origin をカンマ区切りで保持する (services/api/src/index.ts
          # の split(",") を参照) ため env_var 区切りと衝突する。
          # 解決: gcloud の custom delimiter syntax `^|^...` で env_var 区切りを `|` に変更し、
          # CORS_ORIGIN 内で `,` を安全に使えるようにする。
          # `|` は URL / email / プロジェクト名いずれにも通常出現しないため安全。
          #
          # CORS_ORIGIN: Cloud Run は同じ web service に対して旧形式
          # (web-3zcica5euq-an.a.run.app) と新形式 (web-1034821634012.asia-northeast1.run.app)
          # の 2 種類の URL を並列提供している。どちらの origin からアクセスされても
          # CORS preflight が通るよう両方を許可する (2026-05-23 Phase 8 cutover で発覚)。
          # QUIZ_REQUIRE_ACTIVE_SESSION=true: テスト任意化 Stage 5(ケースD厳格化) の
          # 2段階ロールアウト完了。先行デプロイ(=false、挙動不変)を経て本切替。
          # コード側デフォルトも true (有効セッション必須) のため、本フラグ自体は
          # 冗長化のための明示指定として残す。ロールバックする場合は false に戻す
          # (単独リビジョンでの切替のため、切り戻しも新規デプロイのみで完結する)。
          ENV_VARS="^|^NODE_ENV=production|DEMO_ENABLED=true|AUTH_MODE=firebase|CORS_ORIGIN=https://web-3zcica5euq-an.a.run.app,https://web-1034821634012.asia-northeast1.run.app|GOOGLE_WORKSPACE_ADMIN_EMAIL=system@279279.net|SESSION_DURATION_MS=10800000|GCS_RESOURCE_BUCKET=lms-279-resources|DXCOLLEGE_DISPATCH_SUBJECT=system@279279.net|DXCOLLEGE_SENDER_EMAIL=dxcollege@279279.net|QUIZ_REQUIRE_ACTIVE_SESSION=true"
          if [ -n "${{ secrets.SUPER_ADMIN_EMAILS }}" ]; then
            ENV_VARS="${ENV_VARS}|SUPER_ADMIN_EMAILS=${{ secrets.SUPER_ADMIN_EMAILS }}"
          fi
          if [ -n "${{ secrets.DISPATCH_OIDC_AUDIENCE }}" ]; then
            ENV_VARS="${ENV_VARS}|DISPATCH_OIDC_AUDIENCE=${{ secrets.DISPATCH_OIDC_AUDIENCE }}"
          fi
          gcloud run deploy api \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="${ENV_VARS}"

  deploy-web:
    name: Deploy Web
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Web image
        run: |
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api-3zcica5euq-an.a.run.app \
            --build-arg NEXT_PUBLIC_AUTH_MODE=firebase \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:latest \
            .
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:latest

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy web \
            --image=${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

  deploy-mcp:
    name: Deploy MCP (Phase 0 spike)
    # Phase 1a PR2: mcp_oauth_store の複合indexが READY になる前に MCP が新adapterで
    # デプロイされると findByUid 等が FAILED_PRECONDITION になりうる(index rollout race、
    # セカンドオピニオンで指摘・.github/workflows/deploy.yml で自分でも確認済み)ため、
    # deploy-firestore-indexes に依存させる。
    needs: [ci, deploy-firestore-indexes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push MCP image
        run: |
          # Phase 2aで@lms-279/shared-typesへ依存したため、services/api同様
          # リポジトリルートをビルドコンテキストにする（codex review P1指摘、2026-08-23。
          # services/mcp/Dockerfile参照）。
          docker build -f services/mcp/Dockerfile -t ${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/mcp:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/mcp:latest

      - name: Deploy MCP to Cloud Run
        run: |
          # Phase 1a PR1: devInteractions（oidc-providerの組み込みダミー同意画面、任意の
          # ユーザー名でログイン可能）を廃止し、実 Firebase Google サインイン + 自前同意画面
          # に置き換えた（services/mcp/src/interactions/、計画
          # buzzing-rolling-whisper.md 参照）。--allow-unauthenticatedはAnthropicの
          # クラウド基盤からの到達に必須（IAP等ネットワーク層の防御は使えない、計画参照）。
          # 現時点で公開されるツールはpingのみ(実データ・実APIへのアクセスなし)。
          #
          # Phase 1a PR2: Firestore adapter + Secret Manager 署名鍵を導入し、DCR登録
          # クライアント・署名鍵の永続化を実現した(MCP_STORAGE=firestore、
          # MCP_SIGNING_SECRET_NAME、services/mcp/src/index.ts参照)。
          #
          # Phase 1b-1: Firebaseリフレッシュトークンの暗号化永続化を導入
          # (MCP_CREDENTIAL_SECRET_NAME、mcp-oauth-signing-keyとは別シークレット
          # mcp-credential-encryption-key。ローテーション影響範囲を分離するため)。
          # --max-instances=1 は adapter・署名鍵の永続化とは別の理由でまだ残す:
          # oidc-provider の Session/Interaction cookie は cookieKeys で署名されるが、
          # インスタンス間のスティッキーセッション保証がないため、複数インスタンスでの
          # 挙動未検証。解除はPR2の効果を本番で確認してから独立した変更として検討する。
          # --set-env-vars は1回の呼び出しで既存の環境変数を全て置き換える仕様
          # (gcloud run deploy --help)。2回指定すると後勝ちで前の値が消えるため、
          # 単一の呼び出しにまとめる。カスタム区切り文字(^@^)は値にカンマが
          # 含まれても安全なように使う(Firebase設定値は現状カンマを含まないが、
          # 将来の値変更に対する防御)。
          # NODE_ENV=production は deploy-api job(上記117行目)と同じ fail-safe。
          # 未設定だと Express の既定エラーハンドラ(finalhandler)が env!=='production'
          # 時に未捕捉エラーのスタックトレースをレスポンスボディへ含めてしまい、
          # --allow-unauthenticated な本サービスでは誰でも閲覧できてしまう
          # (pr-review-toolkit 2系統のセカンドオピニオンが独立に指摘、実ソースで検証済み)。
          #
          # MCP_TENANT_GUARD_MODE(Phase 2b PR C1)を dry-run → enforce へ切り替える際は、
          # 必ずこの行を編集してPR経由でデプロイすること。`gcloud run services update
          # --update-env-vars` 等での手動切り替えは、上記の通り --set-env-vars が
          # 次回デプロイ時に環境変数を全置換する仕様のため、無関係な後続pushの
          # デプロイで無言で dry-run に巻き戻る（Codex review PR #665 指摘）。
          gcloud run deploy mcp \
            --image=${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --set-env-vars="^@^NODE_ENV=production@MCP_ISSUER_URL=https://mcp-3zcica5euq-an.a.run.app@MCP_STORAGE=firestore@MCP_SIGNING_SECRET_NAME=projects/${{ env.GCP_PROJECT_ID }}/secrets/mcp-oauth-signing-key/versions/latest@MCP_CREDENTIAL_SECRET_NAME=projects/${{ env.GCP_PROJECT_ID }}/secrets/mcp-credential-encryption-key/versions/latest@FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}@FIREBASE_WEB_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}@FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}@LMS_API_BASE_URL=https://api-3zcica5euq-an.a.run.app@MCP_TENANT_GUARD_MODE=enforce"

  deploy-notification:
    name: Deploy Notification
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Notification image
        working-directory: services/notification
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/notification:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/notification:latest

      - name: Deploy Notification to Cloud Run
        run: |
          # ADR-042 運用通知自動化。
          # --service-account: 専用ランタイムSA(notification-runtime)。Secret Manager
          #   accessor + Firestore user のみの最小権限(docs/runbook/monitoring-setup.md §6.1)。
          #   このSAが存在しない状態でデプロイすると失敗するため、bootstrap(SA/IAM/Secret作成)を
          #   必ず本PRのマージ前に完了させること(クロスレビューHigh #9)。
          # OPS_SCHEDULER_AUDIENCE / OPS_PUBSUB_AUDIENCE: 他サービス(DISPATCH_OIDC_AUDIENCE等)と
          #   同じ慣例でCloud Runのbase URLをaudienceとする(パス毎に分けない)。
          # OPS_*_CALLER_EMAILS: OIDC audience検証に加え、呼び出し元SAをallowlist検証する
          #   (クロスレビューHigh #6)。Schedulerは既存のADR-039 SAを共用、Pub/Subは専用SA。
          gcloud run deploy notification \
            --image=${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account=notification-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="^|^NODE_ENV=production|OPS_CHAT_WEBHOOK_SECRET_NAME=projects/${{ env.GCP_PROJECT_ID }}/secrets/ops-chat-webhook-url/versions/latest|OPS_API_HEALTH_READY_URL=https://api-3zcica5euq-an.a.run.app/health/ready|OPS_SCHEDULER_AUDIENCE=https://notification-3zcica5euq-an.a.run.app|OPS_SCHEDULER_CALLER_EMAILS=dxcollege-scheduler@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com|OPS_PUBSUB_AUDIENCE=https://notification-3zcica5euq-an.a.run.app|OPS_PUBSUB_CALLER_EMAILS=ops-pubsub-caller@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
