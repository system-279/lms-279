name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-northeast1
  GCP_PROJECT_ID: lms-279
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev/lms-279/lms-279

jobs:
  # CI checks must pass before deployment
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-firestore-indexes:
    name: Deploy Firestore Indexes
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Firestore indexes
        run: |
          # Install firebase-tools
          npm install -g firebase-tools

          # Deploy indexes using gcloud auth (Workload Identity Federation)
          firebase deploy --only firestore:indexes --project=${{ env.GCP_PROJECT_ID }} --non-interactive

  deploy-api:
    name: Deploy API
    needs: [ci]
    # Note: Firestore indexes are deployed independently and don't block service deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -f services/api/Dockerfile -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/api:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest

      - name: Deploy API to Cloud Run
        run: |
          # Build env vars string
          # NODE_ENV=production は Issue #290 fail-safe (tenant-auth.ts/super-admin.ts の
          # isProductionRuntime) の二重防御として明示。K_SERVICE 自動注入が効かないデプロイ
          # 経路（ローカル再現等）でも本番判定が効くようにする。
          # SESSION_DURATION_MS=10800000 (3時間): 動画 60-80分 + テスト所要時間で
          # 2時間運用では time_limit 強制退室が頻発したため延長 (2026-05-16, 現場声対応)
          # GCS_RESOURCE_BUCKET=lms-279-resources: 講座資料 PDF (ADR-036) の保存先。
          # 動画バケットとは別に独立して IAM/lifecycle/監査を管理する。
          # 単一バケット運用 (dev project / dev Cloud Run なし)。
          # PDF object は master lesson prefix (lessons/{masterLessonId}/...) で管理し、
          # tenant 配信は Firestore メタ (pdfGcsPath) のディープコピーで分離する。
          # 2026-05-17 にバケット作成済み + default compute SA に objectAdmin (bucket scope) 付与済み。
          # DXCOLLEGE_DISPATCH_SUBJECT / DXCOLLEGE_SENDER_EMAIL: Phase 7 DXcollege 自動完了通知用
          #   (ADR-037 案 X、SendAs alias 送信)。subject = DWD JWT impersonation 対象 (実 mailbox)、
          #   sender = MIME From ヘッダ用 alias。spec §5/§8.2 で確定済みの固定値。
          # DISPATCH_OIDC_AUDIENCE: Cloud Scheduler が発行する OIDC token の audience。
          #   api Cloud Run service URL と一致させる必要があるため secret 経由 (環境ごとに異なる)。
          #   未設定なら mount スキップ (services/api/src/index.ts の isProductionGcpRuntime で
          #   fail loud → 設定漏れを起動時に検知)。
          # NOTE: gcloud `--set-env-vars` のデフォルト区切り文字はカンマ `,` だが、
          # CORS_ORIGIN は複数 origin をカンマ区切りで保持する (services/api/src/index.ts
          # の split(",") を参照) ため env_var 区切りと衝突する。
          # 解決: gcloud の custom delimiter syntax `^|^...` で env_var 区切りを `|` に変更し、
          # CORS_ORIGIN 内で `,` を安全に使えるようにする。
          # `|` は URL / email / プロジェクト名いずれにも通常出現しないため安全。
          #
          # CORS_ORIGIN: Cloud Run は同じ web service に対して旧形式
          # (web-3zcica5euq-an.a.run.app) と新形式 (web-1034821634012.asia-northeast1.run.app)
          # の 2 種類の URL を並列提供している。どちらの origin からアクセスされても
          # CORS preflight が通るよう両方を許可する (2026-05-23 Phase 8 cutover で発覚)。
          # QUIZ_REQUIRE_ACTIVE_SESSION=true: テスト任意化 Stage 5(ケースD厳格化) の
          # 2段階ロールアウト完了。先行デプロイ(=false、挙動不変)を経て本切替。
          # コード側デフォルトも true (有効セッション必須) のため、本フラグ自体は
          # 冗長化のための明示指定として残す。ロールバックする場合は false に戻す
          # (単独リビジョンでの切替のため、切り戻しも新規デプロイのみで完結する)。
          ENV_VARS="^|^NODE_ENV=production|DEMO_ENABLED=true|AUTH_MODE=firebase|CORS_ORIGIN=https://web-3zcica5euq-an.a.run.app,https://web-1034821634012.asia-northeast1.run.app|GOOGLE_WORKSPACE_ADMIN_EMAIL=system@279279.net|SESSION_DURATION_MS=10800000|GCS_RESOURCE_BUCKET=lms-279-resources|DXCOLLEGE_DISPATCH_SUBJECT=system@279279.net|DXCOLLEGE_SENDER_EMAIL=dxcollege@279279.net|QUIZ_REQUIRE_ACTIVE_SESSION=true"
          if [ -n "${{ secrets.SUPER_ADMIN_EMAILS }}" ]; then
            ENV_VARS="${ENV_VARS}|SUPER_ADMIN_EMAILS=${{ secrets.SUPER_ADMIN_EMAILS }}"
          fi
          if [ -n "${{ secrets.DISPATCH_OIDC_AUDIENCE }}" ]; then
            ENV_VARS="${ENV_VARS}|DISPATCH_OIDC_AUDIENCE=${{ secrets.DISPATCH_OIDC_AUDIENCE }}"
          fi
          gcloud run deploy api \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="${ENV_VARS}"

  deploy-web:
    name: Deploy Web
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Web image
        run: |
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api-3zcica5euq-an.a.run.app \
            --build-arg NEXT_PUBLIC_AUTH_MODE=firebase \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:latest \
            .
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:latest

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy web \
            --image=${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

  deploy-mcp:
    name: Deploy MCP (Phase 0 spike)
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push MCP image
        working-directory: services/mcp
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/mcp:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/mcp:latest

      - name: Deploy MCP to Cloud Run
        run: |
          # Phase 1a PR1: devInteractions（oidc-providerの組み込みダミー同意画面、任意の
          # ユーザー名でログイン可能）を廃止し、実 Firebase Google サインイン + 自前同意画面
          # に置き換えた（services/mcp/src/interactions/、計画
          # buzzing-rolling-whisper.md 参照）。--allow-unauthenticatedはAnthropicの
          # クラウド基盤からの到達に必須（IAP等ネットワーク層の防御は使えない、計画参照）。
          # 現時点で公開されるツールはpingのみ(実データ・実APIへのアクセスなし)。
          # PR2（Firestore永続化 + Secret Manager署名鍵）が着地するまでは組織カスタム
          # コネクタとしての恒久登録は行わないこと。
          # --max-instances=1: oidc-provider がインメモリadapter/署名鍵のため(PR2で
          # 永続adapterに置き換えるまでの暫定措置、services/mcp/src/oidc.ts参照)、複数
          # インスタンスに分散するとDCR登録・認可コード・トークンがインスタンス間で
          # 共有されず認可フローが失敗する。単一インスタンスに固定して回避する。
          # --set-env-vars は1回の呼び出しで既存の環境変数を全て置き換える仕様
          # (gcloud run deploy --help)。2回指定すると後勝ちで前の値が消えるため、
          # 単一の呼び出しにまとめる。カスタム区切り文字(^@^)は値にカンマが
          # 含まれても安全なように使う(Firebase設定値は現状カンマを含まないが、
          # 将来の値変更に対する防御)。
          gcloud run deploy mcp \
            --image=${{ env.ARTIFACT_REGISTRY }}/mcp:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --set-env-vars="^@^MCP_ISSUER_URL=https://mcp-3zcica5euq-an.a.run.app@FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}@FIREBASE_WEB_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}@FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"

  deploy-notification:
    name: Deploy Notification
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034821634012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@lms-279.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Notification image
        working-directory: services/notification
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/notification:latest .
          docker push ${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/notification:latest

      - name: Deploy Notification to Cloud Run
        run: |
          gcloud run deploy notification \
            --image=${{ env.ARTIFACT_REGISTRY }}/notification:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated
